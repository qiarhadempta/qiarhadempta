name: Update CryptoHack Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/cryptohack.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "stats: update CryptoHack"
